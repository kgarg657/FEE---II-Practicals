<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .img-placeholder {
            height: 120px;
            background: #eee;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .price {
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }

        .add-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .cart-sidebar {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            height: max-content;
        }

        .cart-title {
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #eee;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .checkout-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            margin-top: 15px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Tech Store</h1>

    <div class="main-layout">
        
        <div class="products-grid">
            
            <div class="card">
                <div class="img-placeholder"></div>
                <h3>Laptop</h3>
                <p class="price">$799</p>
                <button class="add-btn">Add to Cart</button>
            </div>

            <div class="card">
                <div class="img-placeholder"></div>
                <h3>Phone</h3>
                <p class="price">$499</p>
                <button class="add-btn">Add to Cart</button>
            </div>

            <div class="card">
                <div class="img-placeholder"></div>
                <h3>Headphones</h3>
                <p class="price">$99</p>
                <button class="add-btn">Add to Cart</button>
            </div>

            <div class="card">
                <div class="img-placeholder"></div>
                <h3>Keyboard</h3>
                <p class="price">$49</p>
                <button class="add-btn">Add to Cart</button>
            </div>

        </div>

        <div class="cart-sidebar">
            <h2 class="cart-title">Your Cart</h2>
            <div class="cart-item">
                <span>Laptop (1)</span>
                <span>$799</span>
            </div>
            <div class="cart-item">
                <span>Headphones (1)</span>
                <span>$99</span>
            </div>
            <div class="total">
                <span>Total:</span>
                <span>$898</span>
            </div>
            <button class="checkout-btn">Checkout</button>
        </div>

    </div>

</body>
</html>
