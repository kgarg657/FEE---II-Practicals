<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinket Login</title>
    <link rel="stylesheet" href="trinkets.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <nav class="nav">
        <h2 class="logo">Trinket</h2>
        
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="">Charms</a></li>
                <li><a href="">Gems</a></li>
                <li><a href="">Jewels</a></li>
            </ul>
            
            <div class="icon-group">
                <div class="animated-icon-container">
                    <i class="fa-solid fa-clover animated-clover"></i>
                </div>
                
                <div class="notification-container">
                    <span class="badge-number">12</span>
                    <i class="fa-solid fa-bell"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="login-card">
            <button type="button" class="cross">&times;</button>
            <div class="login-header">
                <h3>Welcome back</h3>
                <p>Please enter your details</p>
            </div>
            
            <form class="login-form">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="AListia89......." required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Bghb&22........" required>
                        <i class="ques fa-solid fa-question" tabindex="0"></i>
                        <span class="text">Password must be at least 8 characters.</span>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="" class="forgot-link">Forgot Password?</a>
                </div>
                
                <button type="submit" class="login-btn">Log In</button>
                
                <div class="signup-prompt">
                    Don't have an account? <a href="" class="signup-link">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <div class="bubble">
        <i class="fa-solid fa-comment-dots"></i>
    </div>

</body>
</html>
