<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Website</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Times New Roman', Times, serif;
                text-align: center;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                width: 100vw;
                overflow-x: hidden;
                background-color: #f5f5f5;
            }

            .box {
                width: 100vw;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 2rem;
            }

            .box1 {
                background-color: #ffffff;
                color: #222222;
            }

            .box1 h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
            }

            .box1 p {
                font-size: 1.2rem;
                color: #666666;
            }

            .box2 {
                background-image: url("https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1600&auto=format&fit=crop");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }

            .box3 {
                background-color: #111111;
                color: #ffffff;
            }

            .box3 h1 {
                font-size: 2.5rem;
            }

            .box4 {
                background-image: url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1600&auto=format&fit=crop");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }

            .box5 {
                background-color: #ffffff;
                color: #222222;
            }

            .box5 h1 {
                font-size: 2.5rem;
            }
        </style>
    </head>
    <body>
        <div class="box box1">
            <h1>Welcome to the website</h1>
            <p>Scroll down</p>
        </div>

        <div class="box box2"></div>

        <div class="box box3">
            <h1>About Us</h1>
        </div>

        <div class="box box4"></div>

        <div class="box box5">
            <h1>Thanks for visiting</h1>
        </div>
    </body>
</html>
